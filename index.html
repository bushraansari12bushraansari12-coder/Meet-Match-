<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeetMatch – Play. Win. Dominate.</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Bebas+Neue&family=Exo+2:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root {
    --bg: #03060f;
    --bg2: #070d1e;
    --bg3: #0b1428;
    --primary: #00e5ff;
    --primary2: #0099cc;
    --accent: #ff3d57;
    --gold: #ffd700;
    --text: #e8f4ff;
    --text2: #7a9bb5;
    --glow: 0 0 30px rgba(0,229,255,0.3);
    --glow2: 0 0 60px rgba(0,229,255,0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Exo 2', sans-serif;
    overflow-x: hidden;
    cursor: default;
  }

  /* ===== NOISE OVERLAY ===== */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1000;
    opacity: 0.4;
  }

  /* ===== NAV ===== */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 40px;
    background: rgba(3,6,15,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(0,229,255,0.08);
  }

  .nav-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.8rem;
    letter-spacing: 3px;
    color: var(--primary);
    text-shadow: var(--glow);
  }

  .nav-links {
    display: flex;
    gap: 32px;
    list-style: none;
  }

  .nav-links a {
    color: var(--text2);
    text-decoration: none;
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: color 0.2s;
  }

  .nav-links a:hover { color: var(--primary); }

  .nav-cta {
    background: var(--primary);
    color: #000;
    padding: 10px 24px;
    border-radius: 4px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-decoration: none;
    transition: all 0.2s;
    box-shadow: 0 0 20px rgba(0,229,255,0.4);
  }

  .nav-cta:hover {
    background: #fff;
    box-shadow: 0 0 40px rgba(0,229,255,0.6);
    transform: translateY(-1px);
  }

  /* ===== HERO ===== */
  .hero {
    min-height: 100vh;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 80px 20px 40px;
  }

  /* Animated grid background */
  .hero-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    animation: gridMove 20s linear infinite;
  }

  @keyframes gridMove {
    0% { transform: translateY(0); }
    100% { transform: translateY(60px); }
  }

  /* Glowing orbs */
  .hero-orb1 {
    position: absolute;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(0,229,255,0.12) 0%, transparent 70%);
    top: -100px; left: -100px;
    animation: orbFloat 8s ease-in-out infinite;
  }

  .hero-orb2 {
    position: absolute;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(255,61,87,0.1) 0%, transparent 70%);
    bottom: 0; right: -50px;
    animation: orbFloat 10s ease-in-out infinite reverse;
  }

  @keyframes orbFloat {
    0%, 100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(30px, -30px) scale(1.05); }
  }

  .hero-content {
    position: relative;
    text-align: center;
    z-index: 2;
    max-width: 900px;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(0,229,255,0.08);
    border: 1px solid rgba(0,229,255,0.2);
    border-radius: 50px;
    padding: 6px 18px;
    font-size: 0.75rem;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--primary);
    margin-bottom: 28px;
    animation: fadeDown 0.8s ease both;
  }

  .hero-badge .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--primary);
    animation: blink 1.5s infinite;
  }

  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.2;} }

  .hero-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(4rem, 12vw, 8rem);
    line-height: 0.9;
    letter-spacing: 4px;
    margin-bottom: 24px;
    animation: fadeDown 0.8s 0.1s ease both;
  }

  .hero-title span.blue { color: var(--primary); text-shadow: var(--glow); }
  .hero-title span.red { color: var(--accent); }

  .hero-sub {
    font-size: 1.1rem;
    color: var(--text2);
    max-width: 560px;
    margin: 0 auto 40px;
    line-height: 1.7;
    font-weight: 300;
    letter-spacing: 0.3px;
    animation: fadeDown 0.8s 0.2s ease both;
  }

  .hero-btns {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    animation: fadeDown 0.8s 0.3s ease both;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--primary);
    color: #000;
    padding: 16px 36px;
    border-radius: 4px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    text-decoration: none;
    transition: all 0.25s;
    box-shadow: 0 0 30px rgba(0,229,255,0.4), 0 4px 20px rgba(0,0,0,0.4);
    position: relative;
    overflow: hidden;
  }

  .btn-primary::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 0 50px rgba(0,229,255,0.6), 0 8px 30px rgba(0,0,0,0.5); }
  .btn-primary:hover::after { opacity: 1; }

  .btn-outline {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    border: 1px solid rgba(0,229,255,0.3);
    color: var(--primary);
    padding: 16px 36px;
    border-radius: 4px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    text-decoration: none;
    transition: all 0.25s;
    background: rgba(0,229,255,0.04);
  }

  .btn-outline:hover {
    background: rgba(0,229,255,0.1);
    border-color: var(--primary);
    transform: translateY(-3px);
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Hero stats bar */
  .hero-stats {
    display: flex;
    justify-content: center;
    gap: 60px;
    margin-top: 70px;
    padding-top: 40px;
    border-top: 1px solid rgba(0,229,255,0.08);
    animation: fadeDown 0.8s 0.5s ease both;
    flex-wrap: wrap;
  }

  .stat-item { text-align: center; }

  .stat-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.8rem;
    color: var(--primary);
    line-height: 1;
    letter-spacing: 2px;
  }

  .stat-num span { color: var(--accent); }

  .stat-label {
    font-size: 0.7rem;
    color: var(--text2);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 4px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
  }

  /* ===== SECTION COMMON ===== */
  section { padding: 100px 20px; position: relative; }

  .section-tag {
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--primary);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .section-tag::before {
    content: '';
    display: block;
    width: 30px; height: 1px;
    background: var(--primary);
  }

  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.4rem, 6vw, 4rem);
    letter-spacing: 2px;
    line-height: 1;
    margin-bottom: 16px;
  }

  .section-desc {
    color: var(--text2);
    font-size: 1rem;
    font-weight: 300;
    line-height: 1.7;
    max-width: 520px;
  }

  .max-w { max-width: 1200px; margin: 0 auto; }

  /* ===== FEATURES ===== */
  #features { background: var(--bg2); }

  .features-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 2px;
    margin-top: 60px;
  }

  .feature-card {
    background: var(--bg3);
    padding: 40px 32px;
    position: relative;
    overflow: hidden;
    transition: all 0.3s;
    border: 1px solid rgba(0,229,255,0.04);
  }

  .feature-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 2px;
    background: linear-gradient(90deg, var(--primary), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .feature-card:hover { background: #0e1c33; }
  .feature-card:hover::before { opacity: 1; }

  .feature-icon {
    width: 56px; height: 56px;
    border-radius: 12px;
    background: rgba(0,229,255,0.08);
    border: 1px solid rgba(0,229,255,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    color: var(--primary);
    margin-bottom: 24px;
    transition: all 0.3s;
  }

  .feature-card:hover .feature-icon {
    background: rgba(0,229,255,0.15);
    box-shadow: 0 0 20px rgba(0,229,255,0.2);
  }

  .feature-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.2rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 10px;
    color: var(--text);
  }

  .feature-desc {
    color: var(--text2);
    font-size: 0.88rem;
    line-height: 1.7;
    font-weight: 300;
  }

  .feature-num {
    position: absolute;
    bottom: 24px; right: 28px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 4rem;
    color: rgba(0,229,255,0.04);
    letter-spacing: 2px;
    line-height: 1;
  }

  /* ===== HOW IT WORKS ===== */
  #how {
    background: var(--bg);
    overflow: hidden;
  }

  .how-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 40px;
    margin-top: 60px;
    position: relative;
  }

  .how-grid::before {
    content: '';
    position: absolute;
    top: 40px; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0,229,255,0.2), rgba(0,229,255,0.2), transparent);
  }

  .how-step { text-align: center; }

  .step-circle {
    width: 80px; height: 80px;
    border-radius: 50%;
    border: 1px solid rgba(0,229,255,0.25);
    background: var(--bg2);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
    position: relative;
    transition: all 0.3s;
  }

  .step-circle:hover {
    border-color: var(--primary);
    box-shadow: 0 0 25px rgba(0,229,255,0.25);
  }

  .step-circle .step-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.8rem;
    color: var(--primary);
    letter-spacing: 1px;
  }

  .step-title {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .step-desc {
    color: var(--text2);
    font-size: 0.85rem;
    line-height: 1.6;
    font-weight: 300;
  }

  /* ===== TOURNAMENTS ===== */
  #tournaments { background: var(--bg2); }

  .tournament-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    margin-top: 60px;
  }

  .tournament-card {
    background: var(--bg3);
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid rgba(0,229,255,0.06);
    transition: all 0.3s;
    position: relative;
  }

  .tournament-card:hover {
    transform: translateY(-6px);
    border-color: rgba(0,229,255,0.2);
    box-shadow: 0 20px 50px rgba(0,0,0,0.4), 0 0 30px rgba(0,229,255,0.08);
  }

  .t-banner {
    height: 140px;
    position: relative;
    overflow: hidden;
  }

  .t-banner-1 { background: linear-gradient(135deg, #0d2340, #0a3d62, #1565c0); }
  .t-banner-2 { background: linear-gradient(135deg, #2d1b00, #6d3200, #a04000); }
  .t-banner-3 { background: linear-gradient(135deg, #1a0029, #4a0080, #7b00d4); }

  .t-banner-icon {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 4rem;
    opacity: 0.2;
  }

  .t-status {
    position: absolute;
    top: 12px; right: 12px;
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 0.65rem;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .t-status.live { background: var(--accent); color: #fff; animation: pulse 2s infinite; }
  .t-status.open { background: rgba(0,229,255,0.2); color: var(--primary); border: 1px solid var(--primary); }
  .t-status.upcoming { background: rgba(255,215,0,0.15); color: var(--gold); border: 1px solid rgba(255,215,0,0.4); }

  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.7;} }

  .t-body { padding: 20px; }

  .t-mode {
    font-size: 0.65rem;
    color: var(--primary);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .t-name {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 1.1rem;
    margin-bottom: 14px;
    letter-spacing: 0.5px;
  }

  .t-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .t-info { text-align: center; }
  .t-info-val { font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; color: var(--gold); letter-spacing: 1px; }
  .t-info-label { font-size: 0.6rem; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; font-family: 'Rajdhani', sans-serif; }

  .t-join {
    width: 100%;
    background: transparent;
    border: 1px solid rgba(0,229,255,0.3);
    color: var(--primary);
    padding: 10px;
    border-radius: 4px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }

  .t-join:hover {
    background: rgba(0,229,255,0.1);
    border-color: var(--primary);
    box-shadow: 0 0 15px rgba(0,229,255,0.15);
  }

  /* ===== DOWNLOAD ===== */
  #download {
    background: var(--bg);
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .download-bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 100%, rgba(0,229,255,0.08) 0%, transparent 70%);
  }

  .download-inner { position: relative; z-index: 2; }

  .download-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3rem, 8vw, 6rem);
    letter-spacing: 4px;
    line-height: 1;
    margin-bottom: 20px;
  }

  .download-title .highlight {
    color: var(--primary);
    text-shadow: var(--glow);
    display: block;
  }

  .download-desc {
    color: var(--text2);
    font-size: 1rem;
    max-width: 500px;
    margin: 0 auto 50px;
    line-height: 1.7;
    font-weight: 300;
  }

  .download-btn {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    background: linear-gradient(135deg, var(--primary), #0099dd);
    color: #000;
    padding: 20px 48px;
    border-radius: 6px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 1.1rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-decoration: none;
    transition: all 0.3s;
    box-shadow: 0 0 40px rgba(0,229,255,0.35), 0 8px 30px rgba(0,0,0,0.5);
    position: relative;
    overflow: hidden;
  }

  .download-btn::before {
    content: '';
    position: absolute;
    top: -50%; left: -60%;
    width: 40%; height: 200%;
    background: rgba(255,255,255,0.3);
    transform: skewX(-15deg);
    transition: left 0.5s;
  }

  .download-btn:hover { transform: translateY(-4px); box-shadow: 0 0 70px rgba(0,229,255,0.5), 0 12px 40px rgba(0,0,0,0.6); }
  .download-btn:hover::before { left: 120%; }

  .download-btn .btn-icon { font-size: 1.8rem; }

  .download-meta {
    margin-top: 20px;
    font-size: 0.78rem;
    color: var(--text2);
    letter-spacing: 1px;
    font-family: 'Rajdhani', sans-serif;
  }

  .download-meta span {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin: 0 12px;
  }

  .download-meta span i { color: var(--primary); font-size: 0.7rem; }

  /* Download card */
  .dl-card {
    display: inline-block;
    background: var(--bg2);
    border: 1px solid rgba(0,229,255,0.12);
    border-radius: 16px;
    padding: 40px 60px;
    margin-bottom: 30px;
    position: relative;
  }

  .dl-card::before {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(0,229,255,0.2), transparent, rgba(0,229,255,0.1));
    z-index: -1;
  }

  .app-version {
    font-size: 0.72rem;
    color: var(--text2);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-family: 'Rajdhani', sans-serif;
    margin-bottom: 8px;
  }

  .app-size {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1rem;
    color: var(--primary);
    letter-spacing: 2px;
    margin-top: 10px;
  }

  /* ===== MARQUEE ===== */
  .marquee-wrap {
    background: rgba(0,229,255,0.04);
    border-top: 1px solid rgba(0,229,255,0.08);
    border-bottom: 1px solid rgba(0,229,255,0.08);
    padding: 14px 0;
    overflow: hidden;
  }

  .marquee-track {
    display: flex;
    animation: marquee 25s linear infinite;
    width: max-content;
  }

  .marquee-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 40px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text2);
    white-space: nowrap;
  }

  .marquee-item i { color: var(--primary); font-size: 0.6rem; }

  @keyframes marquee { 0%{transform:translateX(0);} 100%{transform:translateX(-50%);} }

  /* ===== FOOTER ===== */
  footer {
    background: var(--bg2);
    border-top: 1px solid rgba(0,229,255,0.06);
    padding: 60px 20px 30px;
  }

  .footer-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    gap: 60px;
    margin-bottom: 50px;
  }

  .footer-brand .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    color: var(--primary);
    letter-spacing: 3px;
    margin-bottom: 14px;
  }

  .footer-brand p {
    color: var(--text2);
    font-size: 0.88rem;
    line-height: 1.7;
    font-weight: 300;
    max-width: 300px;
  }

  .footer-socials {
    display: flex;
    gap: 12px;
    margin-top: 24px;
  }
